# cc-insights configuration
# Default location: ~/.claude/cc-insights/config.toml
# Override with CCI_CONFIG environment variable.

[proxy]
# Address and port the OTEL proxy listens on
listen = "127.0.0.1:4318"
# Shut down proxy after this duration of inactivity
idle_timeout = "15m"

[upstream]
# Forward OTEL data to this endpoint (leave empty to disable forwarding)
url = ""
# Timeout for upstream requests
timeout = "10s"

# Extra headers to send with forwarded requests
[upstream.headers]
# Authorization = "Bearer YOUR_TOKEN"

[storage]
# Path to the SQLite database file
db_path = "~/.claude/cc-insights/metrics.db"
# Number of days to retain metric data (default: 5 years)
retention_days = 1825

# Model pricing in USD per million tokens.
# Built-in defaults use standard Anthropic API pricing.
# For AWS Bedrock Regional endpoints, apply a 10% premium. Example:
#
#   [pricing.opus-4-6]
#   input = 5.50       # 5.0 * 1.1
#   output = 27.50     # 25.0 * 1.1
#   cache_read = 0.55  # 0.50 * 1.1
#   cache_write = 6.875 # 6.25 * 1.1
#
# Bedrock Global endpoints use standard pricing (no premium).
#
# cache_write values below are the 5-minute-TTL rate (1.25 * input). If you run
# Claude Code with ENABLE_PROMPT_CACHING_1H=1, it writes cache blocks with a 1-hour
# TTL, billed at 2 * input instead. The OTEL cacheCreation bucket does not carry the
# TTL, so pick one rate: with the flag on, set cache_write = 2 * input.

[pricing.fable-5]
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 12.5

# Mythos 5 is available only to Project Glasswing participants and uses
